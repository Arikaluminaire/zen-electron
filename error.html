<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Tidak Dapat Terhubung</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030303;
      color: #eee;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .box { text-align: center; max-width: 420px; padding: 24px; }
    h1 { font-size: 20px; font-weight: 600; }
    p { color: #999; font-size: 14px; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 28px;
      background: #f00;
      color: #fff;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
    }
    a:hover { background: #c00; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Tidak dapat terhubung ke YouTube Music</h1>
    <p>
      Sepertinya kamu sedang offline. Aplikasi akan mencoba
      terhubung kembali secara otomatis saat internet tersedia.
    </p>
    <a href="https://music.youtube.com/">Coba Lagi</a>
  </div>
</body>
</html>
